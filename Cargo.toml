[package]
name = "proxy-cli"
version = "0.2.0"
edition = "2021"
authors = ["Antigravity Developer"]
description = "Universal, configurable CLI proxy management toolkit in Rust"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
dirs = "5.0"
anyhow = "1.0"
futures = "0.3"
