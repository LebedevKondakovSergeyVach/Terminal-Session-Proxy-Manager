name: Release

# Two ways in:
#
#   1. A release branch is merged into main. The version in Cargo.toml is
#      already the released one, so this workflow tags it and publishes.
#   2. A tag is pushed by hand, for a re-run or an out-of-band release.
#
# The tag is created and consumed inside the same run on purpose. A tag pushed
# with GITHUB_TOKEN does not trigger further workflows, so relying on the tag
# push to start the build would silently release nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: decide
        run: |
          set -euo pipefail
          crate_version=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$crate_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            version="$crate_version"
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "::notice::v${version} is already tagged; nothing to release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::main is at ${version} with no tag yet; releasing."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify before publishing
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # A commit that cannot pass CI must not become a downloadable binary,
      # even though the pull request that produced it was already green.
      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

      - name: Changelog documents this release
        run: |
          for changelog in CHANGELOG.md CHANGELOG.ru.md; do
            if ! grep -Fq "## [${{ needs.resolve.outputs.version }}]" "$changelog"; then
              echo "::error::$changelog has no section for ${{ needs.resolve.outputs.version }}"
              exit 1
            fi
          done

      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Packages and compiles the crate the way crates.io will, without uploading.
      # Still before the tag, so a bad package publishes nothing.
      - name: Check the crates.io package
        run: cargo publish --dry-run --locked

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: [resolve, verify]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: tspm-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tspm-macos-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tspm-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tspm-linux-arm64.tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Checksums let users verify a download; the release page alone proves
      # nothing about the bytes they actually received.
      - name: Package with checksum
        run: |
          COPYFILE_DISABLE=1 tar -czf "${{ matrix.artifact_name }}" \
            -C "target/${{ matrix.target }}/release" tspm
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish:
    name: Tag, publish and bump Homebrew
    needs: [resolve, build]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read bilingual release notes from the changelogs
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.escape(os.environ["RELEASE_VERSION"])
          pattern = rf"^## \[{version}\][^\n]*\n(.*?)(?=^## |\Z)"
          sections = []
          for language, filename in [("English", "CHANGELOG.md"), ("Русский", "CHANGELOG.ru.md")]:
              match = re.search(pattern, Path(filename).read_text(), re.MULTILINE | re.DOTALL)
              if not match or not match[1].strip():
                  raise SystemExit(f"Missing release notes in {filename}")
              sections.append(f"## {language}\n\n{match[1].strip()}")
          Path("release-notes.md").write_text("\n\n".join(sections) + "\n")
          PY

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Validate archives and prepare the native Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python3 .github/scripts/homebrew_formula.py \
            --version "$RELEASE_VERSION" --artifacts release-artifacts --output tspm.rb
          ruby -c tspm.rb

      # Deliberately after `build`. Tagging first meant a failing matrix leg
      # left the tag pushed with nothing published, and every retry then saw
      # that tag, set should_release=false, and skipped the release for good.
      - name: Create tag
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Release ${{ needs.resolve.outputs.tag }}
          files: release-artifacts/*/*
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Update the native Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          export TSPM_FORMULA_SHA
          TSPM_FORMULA_SHA="$(gh api repos/LebedevKondakovSergeyVach/homebrew-tap/contents/Formula/tspm.rb --jq .sha)"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          payload = {
              "message": f"chore: update tspm to {os.environ['RELEASE_TAG']}",
              "sha": os.environ["TSPM_FORMULA_SHA"],
              "content": base64.b64encode(Path("tspm.rb").read_bytes()).decode(),
          }
          Path(os.environ["RUNNER_TEMP"], "tspm-formula-update.json").write_text(json.dumps(payload))
          PY
          gh api --method PUT repos/LebedevKondakovSergeyVach/homebrew-tap/contents/Formula/tspm.rb \
            --input "$RUNNER_TEMP/tspm-formula-update.json" --silent

  crates:
    name: Publish to crates.io
    needs: [resolve, publish]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Retrying this job must not be able to push a tag or edit the GitHub
    # release. The registry token is the only credential the upload uses.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
