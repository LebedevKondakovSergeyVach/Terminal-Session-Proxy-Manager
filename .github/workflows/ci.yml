name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Advisories appear without any code change, so re-check on a schedule.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere rather than only in the clippy step.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Check documentation builds
        run: cargo doc --no-deps --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked proves Cargo.lock is committed and current; without it a
      # forgotten lockfile update only surfaces at release time.
      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --all-features --locked

      - name: Build release
        run: cargo build --release --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads `rust-version` from Cargo.toml, so the two can never disagree.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'

      - uses: Swatinem/rust-cache@v2

      - name: Check against the declared MSRV
        run: cargo check --all-targets --locked

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
