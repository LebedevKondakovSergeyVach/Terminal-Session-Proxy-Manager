version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action-dependencies:
        patterns:
          - "*"

  # The documentation site. Without this entry nothing ever updates Astro,
  # Starlight or sharp — `rustsec/audit-check` in ci.yml covers Cargo only.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
